name: RalloHR Daily Update

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Get RalloHR files
        uses: actions/checkout@v4

      - name: Update daily timestamp
        run: |
          echo "RalloHR updated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > last-updated.txt

      - name: Save daily update
        run: |
          git config user.name "RalloHR Bot"
          git config user.email "actions@github.com"
          git add last-updated.txt
          git diff --cached --quiet || git commit -m "Daily RalloHR update"
          git push
